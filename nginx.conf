# Sirve la PWA y hace de proxy de /api hacia el backend (mismo sitio: la cookie SameSite=Strict funciona).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;

    # La política de scripts va en el <meta> que genera Angular (autoCsp, con hash del cargador).
    # Aquí NO se declara default-src ni script-src: si se declarara, bloquearía ese cargador.
    set $csp "object-src 'none'; base-uri 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'self'; frame-src 'none'; child-src 'none'; form-action 'self'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE del chat: sin buffer para que los eventos lleguen al momento.
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    # El service worker y el índice nunca se cachean: así las actualizaciones llegan.
    location = /ngsw-worker.js { add_header Cache-Control "no-cache" always; add_header Content-Security-Policy $csp always; }
    location = /ngsw.json { add_header Cache-Control "no-cache" always; add_header Content-Security-Policy $csp always; }
    location = /index.html { add_header Cache-Control "no-cache" always; add_header Content-Security-Policy $csp always; add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; add_header X-Content-Type-Options "nosniff" always; add_header Referrer-Policy "no-referrer" always; add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always; }

    # Archivos con hash en el nombre: caché larga.
    location ~* \.(?:js|css|woff2?|png|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
