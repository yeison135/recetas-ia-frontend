# Sirve la PWA y hace de proxy de /api hacia el backend (mismo sitio: la cookie SameSite=Strict funciona).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE del chat: sin buffer para que los eventos lleguen al momento.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # El service worker, su manifiesto y el índice nunca se cachean: así las actualizaciones llegan.
    location ~ ^/(ngsw-worker\.js|ngsw\.json|index\.html)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Archivos con hash en el nombre: caché larga.
    location ~* \.(?:js|css|woff2?|png|svg|ico|webp|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
