<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <!--
      CSP del APK: en el WebView no hay servidor que mande cabeceras. connect-src debe coincidir con
      apiBase de src/environments/environment.native.ts (cámbialos juntos).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.lasazon.example; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'"
    />
    <title>La Sazón</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b5462a" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
